appId: com.cloudseller.backup
productName: Cloud Seller Backup
directories:
  output: release
files:
  - "**/*"
  - "!release/**"
  - "!node_modules/.cache/**"
# Nomes de arquivo fixos: o site aponta para .../releases/latest/download/<nome>.
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: universal
  artifactName: Cloud-Seller-Backup.${ext}
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Cloud-Seller-Backup-Setup.${ext}
linux:
  target:
    - AppImage
  category: Utility
  artifactName: Cloud-Seller-Backup.${ext}
